<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Az oldal nem található – Ároktői Liget</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#183E35">
<!-- Gyökérhez képesti (/…) útvonalak: a szerver bármilyen mélységű hibás címnél ezt az oldalt adja vissza. -->
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/style.css">
<style>
.nf{min-height:100dvh;display:flex;flex-direction:column;background:var(--green);color:var(--on-green)}
.nf main{flex:1;display:flex;align-items:center;padding-block:48px}
.nf-inner{display:flex;flex-direction:column;gap:22px;max-width:36rem}
.nf-logo{width:96px;height:auto;background:var(--ivory);border-radius:8px;padding:8px}
.nf .nf-code{font:900 clamp(4.5rem,3rem + 8vw,8rem)/.9 var(--serif);color:var(--gold);letter-spacing:-.03em}
.nf h1{font-size:clamp(2rem,1.5rem + 2vw,2.75rem);line-height:1.1;color:var(--on-green)}
.nf p{color:var(--on-green-2);font-size:1.125rem}
.nf-actions{display:flex;flex-direction:column;gap:10px;margin-top:6px}
@media (min-width:560px){.nf-actions{flex-direction:row;flex-wrap:wrap}}
.nf footer{padding-block:20px calc(20px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--on-green-line);font-size:.9375rem;color:var(--on-green-2)}
.nf footer a{color:var(--on-green);text-underline-offset:3px}
</style>
</head>
<body class="nf on-green">
<main>
  <div class="wrap nf-inner">
    <a href="/" aria-label="Ároktői Liget Senior Rezidencia – főoldal"><img class="nf-logo" src="/assets/img/logo.webp" width="176" height="132" alt=""></a>
    <p class="nf-code" aria-hidden="true">404</p>
    <h1>Ezt az oldalt nem találjuk.</h1>
    <p>Lehet, hogy elírás történt a címben, vagy az oldal időközben megszűnt. A főoldalon minden fontos információt megtalál a rezidenciáról.</p>
    <div class="nf-actions">
      <a class="btn btn-gold" href="/">Vissza a főoldalra</a>
      <a class="btn btn-ghost-light" href="/#jelentkezes">Jelentkezem időben</a>
    </div>
  </div>
</main>
<footer>
  <div class="wrap">
    <a href="/adatkezeles.html">Adatkezelési tájékoztató</a> · <a href="/impresszum.html">Impresszum</a>
  </div>
</footer>
</body>
</html>
